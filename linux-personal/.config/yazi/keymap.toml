[[mgr.prepend_keymap]]
on   = "<S-t>"
run  = "close"
desc = "Cerrar pestaña actual"

[[mgr.prepend_keymap]]
on   = "<C-Enter>"
run  = 'shell "$SHELL" --block'
desc = "Abrir shell en el directorio actual"

[[mgr.prepend_keymap]]
on = [ "g", "d" ]
run = "cd ~/dotfiles/linux-personal/.config"
desc = "Cd to dotfiles"

[[mgr.prepend_keymap]]
on = [ "g", "D" ]
run = "cd ~/downloads/"
desc = "Cd to Downloads"

[[mgr.prepend_keymap]]
on = [ "g", "w" ]
run = "cd ~/Wallpapers/"
desc = "Cd to Wallpapers"

[[mgr.prepend_keymap]]
on   = "<Enter>"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on  = "<C-n>"
run = "shell -- dragon -x -i -T %h"
