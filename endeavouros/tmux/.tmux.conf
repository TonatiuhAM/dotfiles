# ===================================================================
# ┌─' Configuración General (Comportamiento) ──────────────────────┐
# ===================================================================

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Habilitar el ratón para que el "touch" funcione (clic en ventanas/paneles)
set -g mouse on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g history-limit 10000

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Asegurar PATH para plugins (bun)
set-environment -g PATH "$HOME/.bun/bin:/usr/local/sbin:/usr/local/bin:/usr/bin:/opt/cuda/bin:/var/lib/flatpak/exports/bin:/usr/lib/jvm/default/bin:/usr/bin/site_perl:/usr/bin/vendor_perl:/usr/bin/core_perl"


# =================================================
# Modo de copia
# =================================================

# Usar Enter (muy fácil de atinar en el celular)
bind-key Enter copy-mode

# Configuración para copiar al portapapeles del sistema (Wayland)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"


# ===================================================================
# ├─' Interfaz personalizada (estilo imagen) ────────────────────────┤
# ===================================================================

# Barra superior fija
set -g status-position top
set -g status-justify left
set -g status-left-length 50
set -g status-right-length 50

# Paleta
set -g @ui-bg "default"
set -g @ui-bg-alt "#242529"
set -g @ui-fg "#c8c4ff"
set -g @ui-fg-dim "#a6a1d9"
set -g @ui-accent "#f3d36a"
set -g @ui-green "#5bff7a"
set -g @ui-line "#b7a6ff"

set -g status-style "bg=default,fg=#{@ui-fg}"

# Izquierda: carpeta + nombre de sesion
set -g status-left "#[fg=#{@ui-accent}]  #S #[default]"

# Derecha: indicador de prefix
set -g status-right "#{?client_prefix,#[bg=#ff9e64],#[bg=#3b4252]}#[fg=#111111,bold] ACCION #[default]"

# Ventanas como cuadros con numero (estilo cajas)
set -g window-status-style "bg=#{@ui-bg},fg=#{@ui-fg-dim}"
set -g window-status-separator " "
set -g window-status-format "#[bg=#{@ui-bg-alt},fg=#{@ui-fg-dim}] #{window_index} #[default]"
set -g window-status-current-style "bg=#{@ui-bg},fg=#{@ui-accent}"
set -g window-status-current-format "#[bg=#{@ui-accent},fg=#111111,bold] #{window_index} #[default]"

# Titulo del panel en la barra superior (despues de ventanas)
set -g window-status-current-format "#[bg=#{@ui-accent},fg=#111111,bold] #{window_index} #[default] #[fg=#{@ui-accent}]#{?pane_title,#{pane_title},panel#{pane_index}}#[default]"

# Sin nombres automaticos en las ventanas
set -g allow-rename off
set -g automatic-rename off

# Barra separadora con nombre de pane
set -g pane-border-status top
set -g pane-border-format "#[fg=#{@ui-line}]─ #[fg=#{@ui-accent}]#{?pane_title,#{pane_title},panel#{pane_index}}#[fg=#{@ui-line}] ─#{repeat:200,─}#[default]"
set -g pane-border-style "bg=default,fg=#{@ui-line}"
set -g pane-active-border-style "bg=default,fg=#{@ui-line}"

# ===================================================================
# ├─' Navegación y Atajos (Estilo Vim y Estándar) ──────────────────┤
# ===================================================================

set-window-option -g mode-keys vi

# Recargar configuración
bind r source-file ~/.tmux.conf \; display "Interfaz adaptada cargada!"

# Atajos de gestión (Vim style)
bind v split-window -h -c "#{pane_current_path}"
bind b split-window -v -c "#{pane_current_path}"
bind t new-window -c "#{pane_current_path}"
bind w kill-pane

# Navegar entre paneles con h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Navegar entre ventanas
bind p previous-window
bind n next-window

# Zoom y Lazygit
bind m resize-pane -Z
bind g display-popup -d '#{pane_current_path}' -w 80% -h 80% -E lazygit
# ===================================================================
# └─' Plugins (Solo lo esencial) ───────────────────────────────────┘
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'eduwass/tmux-palette'

# Raycast like menu plugin
set -g @palette-key 'C-Space'               # optional, default: C-Space (no-prefix)

run '~/.tmux/plugins/tpm/tpm'
