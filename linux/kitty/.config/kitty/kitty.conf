# Font configuration
font_family      SFMono Nerd Font, Maple Mono NF ExtraLight
font_size        13.0

# Window appearance
window_padding_width    10
window_padding_height   5
hide_window_decorations titlebar-only
scrollbar_handle_opacity 0
scrollbar_track_opacity  0
scrollbar_track_hover_opacity 0
confirm_os_window_close 0
sync_to_monitor no

# Background opacity and blur
background_opacity      1
background_blur         20

# Clipboard settings
copy_on_select          yes
strip_trailing_spaces   smart

# Terminal settings
term                    xterm-256color

# Scrollback
scrollback_lines        2000

# --- kitty-scrollback.nvim ---
allow_remote_control socket-only
listen_on            unix:/tmp/kitty
shell_integration    enabled

action_alias kitty_scrollback_nvim kitten /home/tona/.local/share/nvim/site/pack/core/opt/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py
map kitty_mod+space kitty_scrollback_nvim
map kitty_mod+g     kitty_scrollback_nvim --config ksb_builtin_last_cmd_output

# --- Copiar al portapapeles ---
map kitty_mod+alt+g     launch --stdin-source=@last_cmd_output --type=clipboard
map kitty_mod+p>shift+l kitten hints --type line --program @
map kitty_mod+p>shift+w kitten hints --type word --program @

# --- Scroll estilo vim ---
map alt+shift+j scroll_line_down
map alt+shift+k scroll_line_up
map alt+shift+d scroll_page_down
map alt+shift+u scroll_page_up

# --- Modo scroll (ctrl+s>s entra; esc/q/ctrl+s sale) ---
map --new-mode scroll --on-unknown ignore ctrl+s>s
map --mode scroll j       scroll_line_down
map --mode scroll k       scroll_line_up
map --mode scroll d       scroll_page_down
map --mode scroll u       scroll_page_up
map --mode scroll g       scroll_home
map --mode scroll shift+g scroll_end
map --mode scroll esc     pop_keyboard_mode
map --mode scroll q       pop_keyboard_mode
map --mode scroll ctrl+s  pop_keyboard_mode

# --- Apariencia ---
tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   slanted
tab_title_template    "{index}: {title}{' [' + keyboard_mode.upper() + ']' if keyboard_mode else ''}"
active_border_color   #7aa2f7
inactive_text_alpha   0.7    

# --- Layouts ---
enabled_layouts splits,stack
# --- Splits ---
map kitty_mod+enter    launch --location=vsplit --cwd=current
map kitty_mod+minus    launch --location=hsplit --cwd=current
map kitty_mod+r        layout_action rotate
map kitty_mod+h neighboring_window left
map kitty_mod+j neighboring_window down
map kitty_mod+k neighboring_window up
map kitty_mod+l neighboring_window right
map kitty_mod+alt+h move_window left
map kitty_mod+alt+j move_window down
map kitty_mod+alt+k move_window up
map kitty_mod+alt+l move_window right
map ctrl+alt+h resize_window narrower
map ctrl+alt+l resize_window wider
map ctrl+alt+k resize_window taller
map ctrl+alt+j resize_window shorter
map ctrl+alt+0 resize_window reset
map kitty_mod+z toggle_layout stack
map kitty_mod+x close_window

# --- Leader ctrl+s: pulsar, soltar, luego la tecla ---
map ctrl+s>v       launch --location=vsplit --cwd=current
map ctrl+s>b       launch --location=hsplit --cwd=current
map ctrl+s>h       neighboring_window left
map ctrl+s>j       neighboring_window down
map ctrl+s>k       neighboring_window up
map ctrl+s>l       neighboring_window right
map ctrl+s>shift+h move_window left
map ctrl+s>shift+j move_window down
map ctrl+s>shift+k move_window up
map ctrl+s>shift+l move_window right
map ctrl+s>r       layout_action rotate
map ctrl+s>z       toggle_layout stack
map ctrl+s>w       close_window
map ctrl+s>equal   resize_window reset

include themes/catppuccin-mocha.conf
