# ===================================================================
# Configuración General 
# ===================================================================

# Basicos
set -g mouse on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# Bind C-a como prefijo y deshabilitar C-b
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# TODO: NQue poner aqui?
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g history-limit 10000

# ===================================================================
# Theme
# ===================================================================

# Configuraciones
set -g status-position top
set -g status-left-length 100
set -g status-style "fg=#cad3f5,bg=default"
set -g status-left "#[fg=#a6da95, bold] #S #[fg=#cad3f5, nobold]| "
set -g window-status-current-format "#[fg=#8bd5ca,bold]  #[underscore]#I:#W"
set -g window-status-format " #I:#W"
set -g message-style "fg=#cad3f5,bg=default"
set -g status-right-length 100
set -g status-right "#{s|$HOME|~|:pane_current_path}"


# ===================================================================
# Navegación y Atajos
# ===================================================================

set-window-option -g mode-keys vi

# Recargar configuración
bind r source-file ~/.config/tmux/tmux.conf \; display "Recargando configuración..."

# Atajos de gestión (Vim style)
bind v split-window -h -c "#{pane_current_path}"
bind b split-window -v -c "#{pane_current_path}"
bind t new-window -c "#{pane_current_path}"
bind w kill-pane

# Navegar entre paneles con h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Navegar entre ventanas
bind n next-window

# Selector de sesiones (mismo picker que el comando "t" de la shell)
bind p run-shell "~/.config/Scripts/tmux-sessionizer.sh"

# Zoom y Lazygit
bind m resize-pane -Z
bind g display-popup -d '#{pane_current_path}' -w 80% -h 80% -E lazygit
